name: Apply upload PR (rebuild plugin dir on current main)

# 为什么用 pull_request_target 而不是 pull_request：
#   要在**有 secrets 的** base 仓上下文里跑，且**不 checkout fork 的代码**。
# 安全铁律（违反即等于把仓库交给任何能开 PR 的人）：
#   ① 绝不 checkout ref = head.sha；checkout 只取 base.sha；
#   ② 绝不执行 fork 里的任何脚本/校验器；校验器只用 base 仓的 .github/scripts/；
#   ③ fork 的内容只当**数据**读（raw 下载 → 跑我们自己的 validator）→ 从不执行。

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review]

permissions:
  # 2026-11-28 起 `main-protection` 不再要求「必须走 PR」（只留 non_fast_forward + deletion），
  # 所以仓库自带的 GITHUB_TOKEN 就能推 main —— 本文件**不依赖任何 PAT**。
  contents: write        # 建 blob/tree/commit + PATCH refs/heads/main
  pull-requests: write   # 评论 / 关 PR
  issues: write          # PR 的 issue 面：打标签
  actions: write         # 落地后显式 dispatch aggregate（见脚本末尾的「清单重算」）

concurrency:
  # 同一个 PR 串行；不同 PR 之间靠下面「force:false 的 CAS + 重算重试」兜住
  group: apply-upload-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: |
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.fork == true &&
      github.event.pull_request.draft == false &&
      startsWith(github.event.pull_request.title, '[upload]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPO_FULL: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      FORK_FULL: ${{ github.event.pull_request.head.repo.full_name }}
      FORK_PRIVATE: ${{ github.event.pull_request.head.repo.private }}
      LOGIN: ${{ github.event.pull_request.user.login }}

    steps:
      # 只取 base 仓（可信），就地用作校验器的 --root
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: 读 → 校验 → 在 main 之上重建 → CAS 推送 → 评论并关闭
        uses: actions/github-script@v7
        env:
          # 建 blob/tree/commit + PATCH refs/heads/main。仓库自带 token 即可（ruleset 已不要求走 PR）；
          # 若将来又配了 AGGREGATE_PAT，会优先用它（不改脚本也能恢复旧口径）。
          APPLY_TOKEN: ${{ secrets.AGGREGATE_PAT || github.token }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');

            /** git blob sha1 = sha1("blob <len>\\0" + content)，与 `f.sha` 同口径 */
            const gitBlobSha = (buf) => {
              const h = crypto.createHash('sha1');
              h.update(`blob ${buf.length}\u0000`);
              h.update(buf);
              return h.digest('hex');
            };
            const { owner, repo } = context.repo;
            const pr = Number(process.env.PR);
            const pat = process.env.APPLY_TOKEN;
            if (!pat) { core.setFailed('没有可用令牌'); return; }

            // 统一用 fetch 打 PAT 的 REST 调用（不依赖任何额外 npm 包）
            const api = async (method, p, body) => {
              const res = await fetch(`https://api.github.com${p}`, {
                method,
                headers: {
                  Authorization: `Bearer ${pat}`,
                  Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  ...(body ? { 'Content-Type': 'application/json' } : {}),
                },
                body: body ? JSON.stringify(body) : undefined,
              });
              const t = await res.text();
              if (!res.ok) {
                const err = new Error(`${res.status} ${t.slice(0, 300)}`);
                err.status = res.status;
                throw err;
              }
              return t ? JSON.parse(t) : null;
            };

            // 「跳过」= 不落地、不关 PR、留一句人话。绝不静默，也不 throw（避免整片红）
            const skip = async (why, detail) => {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr,
                body: `自动落地 **跳过**：${why}\n\n${detail || ''}\n\n> 维护者可手动合并；修好后再推一次会重新触发。`,
              });
              core.warning(`跳过：${why}`);
            };
            const closeWith = async (note, extra) => {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr, body: `${note}\n\n${extra || ''}`,
              });
              // 标签不存在时 API 会 422。标签只是给 auto-merge 兜底看的记号，
              // 打不上不该让「已落地」这件事变成一次失败的 run（落地和关单才是主体）。
              try {
                await github.rest.issues.addLabels({ owner, repo, issue_number: pr, labels: ['applied'] });
              } catch (e) {
                core.warning(`打 applied 标签失败（${e.status || '?'}）：PR 仍会关闭，落地不受影响`);
              }
              await github.rest.pulls.update({ owner, repo, pull_number: pr, state: 'closed' });
            };

            // ── 闸门①：fork 必须公开（下面用 raw 直读；细粒度 PAT 无权跨仓读 API）
            if (process.env.FORK_PRIVATE === 'true') {
              return skip('fork 是私有仓库，匿名读不到内容', '请把 fork 设为 public，或请维护者手工合并。');
            }

            // ── 闸门②：改动必须全部落在单个 plugins/<id>__<作者>/ 下
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr, per_page: 100,
            });
            if (files.length === 0) return skip('PR 没有任何文件改动');
            if (files.some((f) => f.status === 'renamed')) {
              return skip('PR 含重命名（客户端不会产生这种改动）', '重命名无法判定归属，留给人合并。');
            }
            const live = files.filter((f) => f.status !== 'removed');
            if (live.length === 0) return skip('PR 只有删除，没有新增内容');

            const dirs = new Set();
            for (const f of live) {
              if (!f.filename.startsWith('plugins/')) {
                return skip(`PR 改到了 \`plugins/\` 之外：\`${f.filename}\``, '只允许上传插件目录。');
              }
              if (f.filename.includes('..') || f.filename.includes('\\')) {
                return skip(`非法路径：\`${f.filename}\``);
              }
              dirs.add(f.filename.split('/')[1]);
            }
            if (dirs.size !== 1) {
              return skip(
                `一次落地只支持 1 个插件目录，本 PR 有 ${dirs.size} 个：${[...dirs].join(', ')}`,
                '批量上传请分成多个 PR（客户端当前就是「一 PR 一组目录」，出现多个说明被改过）。',
              );
            }
            const dir = [...dirs][0];
            if (!/^[A-Za-z0-9._-]+$/.test(dir) || !dir.includes('__')) {
              return skip(`目录名不合规：\`${dir}\``);
            }

            // ── 闸门③：署名归属（与 takedown.yml 同口径，忽略大小写）
            const author = dir.slice(dir.lastIndexOf('__') + 2);
            const login = process.env.LOGIN;
            const anonymous = author.startsWith('anonymous-');
            if (!anonymous && author.toLowerCase() !== login.toLowerCase()) {
              return skip(
                `署名不是 PR 作者本人（\`${dir}\` 的作者是 **${author}**，PR 由 @${login} 发出）`,
                '非上传者不可替别人迭代（DECISIONS.md §3-5）。',
              );
            }
            if (anonymous) {
              return skip('匿名署名的上传需人工合并', '`plugins/<id>__anonymous-xxxx` 无法校验归属。');
            }

            // ── 闸门④：体积（与客户端 MAX_FILE_BYTES / MAX_PLUGIN_BYTES 对齐）
            //    ⚠️ `pulls.listFiles` 的 `size` **可能是 null**（PR #50 实测：plugin.json 记 undefined）。
            //    以前这里直接比 `buf.length !== f.size`，等于把「字段缺失」判成「大小不符」，
            //    结果 B 每次都 skip、最后靠人手动合并 —— 看起来像"自动落地不工作"。
            //    真实完整性改由 git blob sha 兜住（见下面读到内容后的校验）。
            const MAX_FILE = 10 * 1024 * 1024, MAX_ALL = 20 * 1024 * 1024;
            let total = 0;
            for (const f of live) {
              const known = typeof f.size === 'number';
              if (known && f.size > MAX_FILE) return skip(`文件过大：\`${f.filename}\`（${f.size} 字节）`);
              if (known) total += f.size;
            }
            if (total > MAX_ALL) return skip(`插件包总体积 ${total} 字节超过 20MB`);

            // ── 读内容：raw（fork 公开，匿名可读），边读边落到 **本 runner 的 base 检出**里
            //    校验器直接看「合并之后的 registry」，不用另造一棵假树
            fs.rmSync(path.join('plugins', dir), { recursive: true, force: true });
            const rawBase = `https://raw.githubusercontent.com/${process.env.FORK_FULL}/${process.env.HEAD_SHA}`;
            const payload = [];
            for (const f of live) {
              const rel = f.filename.slice(`plugins/${dir}/`.length);
              if (!rel || rel.split('/').some((s) => s === '' || s === '.' || s === '..')) {
                return skip(`非法相对路径：\`${f.filename}\``);
              }
              const url = `${rawBase}/${f.filename.split('/').map(encodeURIComponent).join('/')}`;
              const res = await fetch(url);
              if (!res.ok) return skip(`下载失败：\`${f.filename}\` → HTTP ${res.status}`);
              const buf = Buffer.from(await res.arrayBuffer());
              // 完整性：按 git 的 blob 口径实算 sha1，与 PR 记录的 `f.sha` 比对。
              // 这比 `size` 可靠（size 可能为 null），也比"等下建 blob 再比"更早失败。
              const blobSha = gitBlobSha(buf);
              if (f.sha && blobSha !== f.sha) {
                return skip(
                  `内容校验失败：\`${f.filename}\``,
                  `PR 记 \`${f.sha}\`，下载后实算 \`${blobSha}\`（${buf.length} 字节）。内容在传递途中被改过。`,
                );
              }
              if (typeof f.size === 'number' && buf.length !== f.size) {
                return skip(`大小不符：\`${f.filename}\`（PR 记 ${f.size}，实得 ${buf.length}）`);
              }
              const dest = path.join('plugins', dir, rel);
              fs.mkdirSync(path.dirname(dest), { recursive: true });
              fs.writeFileSync(dest, buf);
              payload.push({ path: `plugins/${dir}/${rel}`, sha: blobSha, content: buf });
            }

            // ── 闸门⑤：跑 **base 仓自己的**校验器（唯一权威，与 CI 同一套规则）
            // 用 child_process 而不是 `exec` 全局：github-script 是否注入 `exec` 随版本变化，
            // 而 `require('child_process')` 是 node 内建，永远有。这里挂掉会表现为「B 静默不工作」。
            const { spawnSync } = require('child_process');
            const run = spawnSync('python3', ['.github/scripts/validate_plugins.py', '--root', '.'], {
              encoding: 'utf8',
              maxBuffer: 8 * 1024 * 1024,
            });
            const out = `${run.stdout || ''}${run.stderr || ''}`;
            const code = run.status === null ? 1 : run.status;
            if (run.error) {
              return skip('校验器无法启动（python3 不可用）', String(run.error));
            }
            if (code !== 0) {
              return skip('校验器不通过（`.github/scripts/validate_plugins.py`）', out.slice(-3000));
            }

            // ── 写：blob 只建一次（内容寻址，sha 稳定）；之后 CAS 循环里重算 tree/commit
            const blobs = [];
            for (const p of payload) {
              const b = await api('POST', `/repos/${owner}/${repo}/git/blobs`, {
                content: p.content.toString('base64'), encoding: 'base64',
              });
              if (b.sha !== p.sha) {
                return skip(`blob sha 与 PR 记录不符：\`${p.path}\``, `PR 记 \`${p.sha}\`，上传后 \`${b.sha}\`。内容在中间环节被改过，落地即等于换了包。`);
              }
              blobs.push({ path: p.path, mode: '100644', type: 'blob', sha: b.sha });
            }

            const title = (await github.rest.pulls.get({ owner, repo, pull_number: pr })).data.title;
            let landed = null, lastErr = '';
            for (let attempt = 1; attempt <= 3 && !landed; attempt++) {
              const mainSha = (await api('GET', `/repos/${owner}/${repo}/git/ref/heads/main`)).object.sha;
              const mainTree = (await api('GET', `/repos/${owner}/${repo}/git/commits/${mainSha}`)).tree.sha;

              const hasOld = await api('GET', `/repos/${owner}/${repo}/contents/plugins/${dir}?ref=${mainSha}`)
                .then(() => true)
                .catch((e) => { if (e.status === 404) return false; throw e; });

              let baseTree = mainTree;
              if (hasOld) {
                // 分两次请求：同一请求里「删目录 + 加同路径文件」的顺序 GitHub 没有承诺
                const cleared = await api('POST', `/repos/${owner}/${repo}/git/trees`, {
                  base_tree: mainTree,
                  tree: [{ path: `plugins/${dir}`, mode: '040000', type: 'tree', sha: null }],
                });
                baseTree = cleared.sha;
              }
              const newTree = await api('POST', `/repos/${owner}/${repo}/git/trees`, { base_tree: baseTree, tree: blobs });

              if (newTree.sha === mainTree) {
                return closeWith(`这次改动与 \`main\` 上的 \`plugins/${dir}\` **逐字节相同**，无需落地。`);
              }

              const commit = await api('POST', `/repos/${owner}/${repo}/git/commits`, {
                message: `${title}\n\n由 apply-upload.yml 在 main（${mainSha.slice(0, 7)}）之上重建 \`plugins/${dir}\` 后落地（原 PR #${pr}）。`,
                tree: newTree.sha,
                parents: [mainSha],
              });

              try {
                await api('PATCH', `/repos/${owner}/${repo}/git/refs/heads/main`, { sha: commit.sha, force: false });
                landed = commit.sha;
              } catch (e) {
                lastErr = `${e.status}`;
                if (e.status !== 422 && e.status !== 409) {
                  return skip('推送 main 失败（多半是 PAT 不能绕 ruleset）', lastErr + ' ' + e.message);
                }
                core.warning(`第 ${attempt} 次与 main 抢写冲突（${e.status}），重读 main 重算`);
                await new Promise((r) => setTimeout(r, 1200 * attempt));
              }
            }
            if (!landed) {
              return skip('连续 3 次 CAS 冲突（main 一直被别人推进）', '重推一次 PR 会重新触发，不影响已合并的内容。');
            }

            // ── 清单重算：**必须显式触发**。
            //    GITHUB_TOKEN 推送产生的事件不会再去触发别的 workflow（GitHub 防递归），
            //    而上面那一步就是一次 GITHUB_TOKEN 的 push —— 不 dispatch 的话
            //    aggregate.yml 不会跑，index.json 会停在旧版本，插件在中心里看不到。
            //    workflow_dispatch 是唯一被允许的例外（显式 API 调用，不算"事件"）。
            try {
              await api('POST', `/repos/${owner}/${repo}/actions/workflows/aggregate.yml/dispatches`, { ref: 'main' });
              core.info('已 dispatch aggregate 重算 index.json');
            } catch (e) {
              core.warning(`dispatch aggregate 失败（${e.status || '?'}）：清单要等下一次推送才会补算。${e.message}`);
            }

            return closeWith(
              `已按当前 \`main\` 重建并落地 \`plugins/${dir}\`：commit \`${landed}\``,
              [
                `- 依据：PR head \`${process.env.HEAD_SHA.slice(0, 7)}\` 的 ${payload.length} 个文件`,
                `- 方式：以 \`main\` 为父提交重建该目录（**不是 merge**，fork 落后也不会冲突）`,
                `- 完整性：${payload.length} 个 blob 的 sha 与 PR 记录逐一相符`,
                '',
                '> 清单（index.json / by-app）由 aggregate.yml 随后重算；本 PR 关闭而非合并，历史里没有 merge commit。',
              ].join('\n'),
            );
