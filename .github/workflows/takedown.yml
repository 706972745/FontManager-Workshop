name: Takedown (author self-service)

# 作者自助下架：校验通过后**直接生效**，不需要维护者点合并。
#
# 两条入口：
#   ① `[takedown]` issue（新版面板走这条：不需要 fork，老令牌也能用）
#   ② `[remove]` PR（旧版面板还在发；fork 能同步时也走这条，带 diff 记录）
#
# 为什么需要它：main 开了 required review，作者（非协作者）永远合不了自己的下架 PR，
# 「下架」按钮实际等于「提交一个没人处理的请求」——用户看到的就是「没有权限」。
#
# 安全边界（缺一不可）：
#   1. 发起人必须等于目录名后缀（`plugins/<id>__<作者>`，忽略大小写）；
#   2. PR 情况下：head 必须是作者自己的 fork，且**所有**变更都是删除（不许夹带上新/修改）；
#   3. 目标目录必须真实存在于 main（防空请求）；
#   4. 只删这些目录下的文件，别的一个都不碰。
# 通过后**直接删除并推 main**，评论 + 关闭入口；任何一条不过 → 评论原因 + 关闭，绝不放行。
# 推 main 用的是仓库自带 GITHUB_TOKEN（`contents: write`）；AGGREGATE_PAT 已废弃，
# 配了会优先用，没配也不影响（2026-11-28 起 ruleset 不再要求走 PR）。
# 维护者仍可在网页/面板删任何插件。
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  # 2026-11-28：`contents` 必须是 **write**。
  # 以前这里写 read、靠 AGGREGATE_PAT 掩盖；PAT 废弃后 GITHUB_TOKEN 只有 read，
  # 于是 createTree / createCommit / updateRef 一律 "Resource not accessible by integration"
  # （#51 实测：脚本第 86 行 createTree 直接抛错，issue 至今没人关）。
  # ruleset 已不再要求「必须走 PR」，所以 write 能直接推 main。
  contents: write
  issues: write
  pull-requests: write
  # 2026-11-28：删完必须显式让 aggregate.yml 重算清单。
  # 本文件推 main 用的是 GITHUB_TOKEN，而 **GITHUB_TOKEN 产生的 push 事件不会再触发
  # 别的 workflow**（GitHub 的防递归硬规则）。所以 aggregate.yml 那个
  # `on: push: paths: plugins/**` 收不到这次删除 —— 实测 07:16:44 删掉
  # FM-ADOBE-FONT 之后，aggregate 一次都没跑，清单里那条幽灵条目挂了半小时。
  actions: write

concurrency:
  group: takedown-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  takedown:
    if: |
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '[takedown]')) ||
      (github.event_name == 'pull_request_target' && startsWith(github.event.pull_request.title, '[remove]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          # 配了 AGGREGATE_PAT 就优先用（向后兼容）；没配就用 GITHUB_TOKEN —— 后者需要
          # permissions.contents: write 才推得动 main，别改成 read。
          github-token: ${{ secrets.AGGREGATE_PAT || github.token }}
          script: |
            const { owner, repo } = context.repo
            const isIssue = context.eventName === 'issues'
            const payload = isIssue ? context.payload.issue : context.payload.pull_request
            const number = payload.number
            const author = payload.user.login.toLowerCase()
            const problems = []
            const dirs = new Set()

            const checkDir = (dir, where) => {
              const cut = dir.lastIndexOf('__')
              if (cut < 0) return problems.push(`${where}：目录名必须是 <插件>__<作者>`)
              if (dir.slice(cut + 2).toLowerCase() !== author) {
                problems.push(`${where}：不属于 @${author}（只能下架署名是自己的插件）`)
              }
              dirs.add(dir)
            }

            if (isIssue) {
              // ① issue：目录从标题解析；发起人 = issue 作者（服务端给的，不可伪造）
              const rest = payload.title.replace(/^\[takedown\]\s*/i, '')
              const parts = rest.split(',').map((s) => s.trim()).filter(Boolean)
              if (parts.length === 0) problems.push('标题里没有要下架的目录')
              for (const part of parts) {
                const m = /^plugins\/([^/]+)$/.exec(part)
                if (!m) { problems.push(`${part}：不是 plugins/<目录> 形态`); continue }
                checkDir(m[1], part)
              }
            } else {
              // ② PR：head 必须是作者自己的 fork，且全部是删除
              if (!payload.head.repo || !payload.head.repo.fork ||
                  (payload.head.repo.owner.login || '').toLowerCase() !== author) {
                problems.push(`PR 必须来自 @${author} 自己的 fork`)
              }
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: number, per_page: 100,
              })
              if (files.length === 0) problems.push('这个 PR 没有任何文件变更')
              for (const f of files) {
                if (f.status !== 'removed') {
                  problems.push(`${f.filename}：不是删除（下架 PR 里不许夹带新增/修改）`)
                  continue
                }
                const m = /^plugins\/([^/]+)\//.exec(f.filename)
                if (!m) { problems.push(`${f.filename}：不在 plugins/ 下`); continue }
                checkDir(m[1], f.filename)
              }
            }

            const say = (body) =>
              github.rest.issues.createComment({ owner, repo, issue_number: number, body })
            const close = () =>
              isIssue
                ? github.rest.issues.update({ owner, repo, issue_number: number, state: 'closed' })
                : github.rest.pulls.update({ owner, repo, pull_number: number, state: 'closed' })

            const reject = async (why) => {
              await say(`**没有执行下架**：\n\n${why.map((w) => `- ${w}`).join('\n')}\n\n` +
                '下架只允许删除 `plugins/<插件>__<你自己的登录名>/` 下的文件，' +
                '且不能夹带任何其它改动。需要人工处理请直接联系维护者。')
              await close()
            }

            if (problems.length > 0) return reject(problems)

            // 清单重算：本文件无论「真删了」还是「目录本来就不在」，都要让 aggregate 跑一次。
            // 后者尤其容易漏 —— 目录已删但清单还挂着那条时，作者看到的就是「下架点了没反应」。
            // 失败只 warning：删除已经成功，不能因为清单没算把下架报成失败（作者会反复点）。
            const recompute = async () => {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo, workflow_id: 'aggregate.yml', ref: 'main',
                })
                core.info('已 dispatch aggregate 重算清单')
              } catch (e) {
                core.warning(
                  `dispatch aggregate 失败（${e.status || '?'}）：清单要等下一次推送或定时兜底才重算。${e.message}`,
                )
              }
            }

            // ③ 目录必须真实存在于 main
            const mainRef = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' })
            const baseSha = mainRef.data.object.sha
            const baseCommit = await github.rest.git.getCommit({ owner, repo, commit_sha: baseSha })
            const baseTree = baseCommit.data.tree.sha
            const flat = await github.rest.git.getTree({ owner, repo, tree_sha: baseTree, recursive: 'true' })
            if (flat.data.truncated) {
              return reject(['仓库文件树过大，无法在一次请求里校验 —— 请联系维护者手动下架'])
            }
            const dirList = [...dirs]
            const targets = flat.data.tree.filter(
              (e) => e.type === 'blob' && dirList.some((d) => e.path.startsWith(`plugins/${d}/`)),
            )
            if (targets.length === 0) {
              // 目录不在了 ≠ 清单是对的：它可能正是被上一次推送删掉、而清单没重算，
              // 于是中心里还挂着。所以这里也要补一次重算，不能只回一句就关。
              await recompute()
              await say('这些目录已经不在仓库里了，视为已下架。已让清单重算，插件中心稍后会消失。')
              return close()
            }

            // ④ 只删这些目录下的 blob，其余文件一个都不碰
            const tree = await github.rest.git.createTree({
              owner, repo, base_tree: baseTree,
              tree: targets.map((e) => ({ path: e.path, mode: '100644', type: 'blob', sha: null })),
            })
            const commit = await github.rest.git.createCommit({
              owner, repo,
              message: `[remove] ${dirList.join(', ')} by ${payload.user.login}\n\n` +
                '由作者自助下架（GitHub Action 校验归属后自动执行）。',
              tree: tree.data.sha,
              parents: [baseSha],
            })
            try {
              await github.rest.git.updateRef({
                owner, repo, ref: 'heads/main', sha: commit.data.sha, force: false,
              })
            } catch (e) {
              // 409/422：期间有人推了 main（parent 过期）→ 让作者再点一次
              return reject([`下架时仓库刚好有新提交，请稍后重新点一次下架（${e.status}）`])
            }

            await recompute()
            await say(`已下架：\n\n${dirList.map((d) => `- \`plugins/${d}/\``).join('\n')}\n\n` +
              '已让清单重算，插件中心稍后会消失（通常 10 秒~1 分钟）。')
            await close()
