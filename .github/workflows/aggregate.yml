name: Aggregate index.json + by-app slices

# 合并之后重算 index.json（全量）与 by-app/<前缀>.json（按软件切片）——
# 上传者不需要（也不允许）手写 sha256：
# 抄错一个字节，用户就会卡在「sha256 校验失败」，而且没人知道错在哪。
#
# ⚠️ main 开了 required PR 以后，这个 job 默认**推不上去**：
# 个人账号下的仓库不允许把 GitHub Actions 加进 ruleset 的 bypass 名单
# （API 报 422「Actor GitHub Actions integration must be part of the ruleset
# source or owner organization」，网页 Add bypass 里也搜不到），所以 GITHUB_TOKEN
# 的 push 会被 required PR 拦下。
#
# 两条路，本文件都兜住：
#   ① 配了 `AGGREGATE_PAT`（仓库 Settings → Secrets → Actions）→ 用它推，
#      令牌属于管理员账号，命中 bypass 里的 Repository admin，直接进 main，全自动；
#   ② 没配 → GITHUB_TOKEN 推失败 → **自动改开一个 PR**，人工点合并。
#      绝不静默失败：失败时 index.json 不更新，插件会「已合并但中心看不到」。
on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "official.json"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aggregate-index
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # eol 守卫要读 blob 比对字节，需要完整历史
          fetch-depth: 0
          # 必须在这里给 token：`git push` 用的是 checkout 存下的 http.extraheader，
          # 只在「有变化才提交」步骤里设 GH_TOKEN 是没用的 —— 那只影响 gh 命令行。
          # 2026-11-25 实测：配了 secret 仍然被 required PR 拦下，日志里那条
          # `.extraheader AUTHORIZATION: basic ***` 就是 GITHUB_TOKEN 留下的。
          # 配了 PAT（管理员身份 → 命中 ruleset 的 Repository admin bypass）就能直推；
          # 没配则退回 GITHUB_TOKEN，照旧走下面的「改开 PR」分支。
          token: ${{ secrets.AGGREGATE_PAT || github.token }}

      - name: 校验（index 只描述通过校验的插件）
        run: python3 .github/scripts/validate_plugins.py --root .

      - name: 重生成 index.json 与 by-app 切片
        run: python3 .github/scripts/aggregate_index.py --root .

      - name: 有变化才提交
        env:
          # 配了 PAT 就用 PAT（管理员 → 可绕过 required PR）；没配退回 GITHUB_TOKEN
          GH_TOKEN: ${{ secrets.AGGREGATE_PAT || github.token }}
        run: |
          # 产物是 index.json（全量）+ by-app/*.json（按软件切片），两者都要跟。
          # 只比 index.json 的话，改了插件但切片没更新时会误以为「没变化」。
          changed=0
          for f in index.json by-app/*.json; do
            if [ ! -f "$f" ]; then
              changed=1
              continue
            fi
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              A=$(git show "HEAD:$f" | jq 'del(.generatedAt)' | jq -S .)
            else
              A=""
            fi
            B=$(jq 'del(.generatedAt)' "$f" | jq -S .)
            if [ "$A" != "$B" ]; then
              changed=1
            fi
          done
          if [ "$changed" = "0" ]; then
            echo "清单内容没变化（只有 generatedAt 变了或完全没变）—— 跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json by-app
          git commit -m "chore(index): 由 aggregate_index.py 重生成（含 by-app 切片）"

          if git push; then
            echo "index.json / by-app 已直接推送到 main"
            exit 0
          fi

          # 推不上去（没配 PAT，或 PAT 也不是管理员）→ 开 PR，让维护者点一下
          echo "::warning::直接推送被拒：检查 AGGREGATE_PAT 是否已配置、是否带 contents:write、是否属于管理员账号"
          BRANCH="chore/index-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(index): 重生成 index.json 与 by-app 切片" \
            --body "main 开了 required PR，Actions 无法绕过（个人账号限制），所以改开 PR。合并后新插件才会出现在插件中心。"
