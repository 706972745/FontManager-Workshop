name: Validate plugin PRs

# 每个动到插件目录的 PR 都跑一遍。规则全在 .github/scripts/validate_plugins.py ——
# 本地跑的是同一份代码，改规则时不用靠「推上去看红灯」来验证。
on:
  pull_request:
    paths:
      - "plugins/**"
      - ".github/scripts/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 作者归属校验要跟基线比 diff，浅克隆拿不到 base
          fetch-depth: 0

      - name: 校验清单 / 文件 / 权限 / 作者归属
        env:
          # fork 来的 PR 用 PR 作者登录名
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: origin/${{ github.base_ref }}
        run: |
          python3 .github/scripts/validate_plugins.py \
            --root . \
            --author "$AUTHOR" \
            --base "$BASE"
