name: Validate plugin PRs
on:
  pull_request:
    paths: ["plugins/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: manifest schema & sha256
        shell: python
        run: |
          import json, glob, hashlib, os, re, sys
          ok = True
          for mf in glob.glob("plugins/*/__x".replace("__x","/plugin.json")) + glob.glob("plugins/*/plugin.json"):
              d = json.load(open(mf, encoding="utf-8"))
              for k in ("id","name","brief","detail","author","version","files"):
                  assert k in d, f"{mf} missing {k}"
              assert re.match(r"^[a-z0-9-]{2,40}$", d["id"]), f"{mf} bad id"
              assert len(d["brief"]) <= 200 and len(d["detail"]) <= 1000
              parent = os.path.dirname(mf)
              assert os.path.basename(parent) == f"{d['id']}__{d['author']}", f"{mf}: dir name mismatch"
              for f in d["files"]:
                  p = os.path.join(parent, f["path"])
                  h = hashlib.sha256(open(p,"rb").read()).hexdigest()
                  if f.get("sha256"): assert h == f["sha256"], f"{p} sha mismatch"
          print("validate ok" if ok else "fail")
